version: "3"

dotenv:
  - .env

env:
  GOWORK: off

tasks:
  tidy:
    desc: Remove unused Go module requirements
    cmds:
      - go mod tidy

  fix:
    desc: Format Go source
    cmds:
      - gofmt -w .

  validate:
    desc: Validate Go source and tests
    cmds:
      - go test ./...

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  e2e:
    desc: Run deterministic end-to-end tests
    cmds:
      - go test ./... -run 'TestE2E'

  e2e:live:
    desc: Run opt-in live provider smoke tests
    env:
      SPRITES_AI_GEN_LIVE: "1"
    cmds:
      - go test ./... -run 'TestLive'
